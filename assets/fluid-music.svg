<text x="742" y="322" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600" fill="#f4f0e6" >Hermes audio</text>
<text x="742" y="350" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#aab8be" >Radio + local playback</text>
