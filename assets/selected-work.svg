<rect x="56" y="195" width="91" height="24" rx="4" fill="#131e25" stroke="#34434e"/>
<text x="63" y="212" font-family="Consolas,monospace" font-size="12" font-weight="400" fill="#aab8c0" >SPOTIFY</text>
