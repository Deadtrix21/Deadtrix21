<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 485" width="1000" height="485" role="img" aria-labelledby="title desc">
<title id="title">FluidMusic — one queue, different engines</title>
<desc id="desc">Spotify, radio and local-library entries share a coordinator. Spotify plays on a Connect device; radio and local audio play inside Hermes. Audio analysis is source-dependent.</desc>
<style>.flow{stroke-dasharray:12 16;animation:flow 5s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.wave{transform-box:fill-box;transform-origin:center;animation:wave 1.8s ease-in-out infinite alternate}.wave:nth-child(3n){animation-delay:-.6s}.wave:nth-child(3n + 1){animation-delay:-1.2s}@keyframes flow{to{stroke-dashoffset:-140}}@keyframes pulse{50%{opacity:.4}}@keyframes wave{to{transform:scaleY(.35)}}@media(prefers-reduced-motion:reduce){.flow,.pulse,.wave{animation:none}}</style>
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
<path d="M32 0H0V32" fill="none" stroke="#26333b" stroke-opacity=".35"/>
</pattern>
</defs>
<rect width="1000" height="485" rx="12" fill="#0b1218"/>
<rect x="1" y="1" width="998" height="483" rx="12" fill="url(#grid)" stroke="#2c3b43"/>
<text x="36" y="38" font-family="Consolas,monospace" font-size="14" font-weight="400" fill="#3ad6c6" letter-spacing="1.2">01 / FLUIDMUSIC</text>
<text x="730" y="38" font-family="Consolas,monospace" font-size="14" font-weight="400" fill="#ffb347" letter-spacing="1.2">HERMES DESKTOP</text>
<text x="36" y="85" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" fill="#f4f0e6" >One queue. Different engines.</text>
<text x="36" y="117" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#aab8be" >Keep the listening flow. Keep the provider boundaries.</text>
<text x="36" y="160" font-family="Consolas,monospace" font-size="14" font-weight="400" fill="#3ad6c6" letter-spacing="1.2">SOURCES</text>
<text x="355" y="160" font-family="Consolas,monospace" font-size="14" font-weight="400" fill="#3ad6c6" letter-spacing="1.2">COORDINATOR</text>
<text x="730" y="160" font-family="Consolas,monospace" font-size="14" font-weight="400" fill="#3ad6c6" letter-spacing="1.2">PLAYBACK</text>
<rect x="36" y="180" width="257" height="62" rx="8" fill="#121d24" stroke="#34434e"/>
