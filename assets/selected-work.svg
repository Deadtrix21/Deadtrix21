<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="392" viewBox="0 0 1000 392" role="img" aria-labelledby="title desc">
<title id="title">Selected public work at Noxius Studium</title>
<desc id="desc">FluidMusic coordinates music sources; Enchanted Composer supports drafts, prompts and voice; EventFlowSys routes messages. Concept diagrams, not application screenshots.</desc>
<style>
.flow{stroke-dasharray:18 14;animation:flow 5s linear infinite}
.pulse{animation:pulse 3s ease-in-out infinite}
.orbit{transform-origin:813px 183px;animation:orbit 24s linear infinite}
.scan{animation:scan 4s ease-in-out infinite alternate}
@keyframes flow{to{stroke-dashoffset:-160}}
@keyframes pulse{50%{opacity:.35}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes scan{to{transform:translateX(110px)}}
@media(prefers-reduced-motion:reduce){.flow,.pulse,.orbit,.scan{animation:none}}
</style>
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
<path d="M32 0H0V32" fill="none" stroke="#26343d" stroke-opacity=".34"/>
</pattern>
</defs>
<rect width="1000" height="392" rx="12" fill="#0b1015"/>
<rect x="1" y="1" width="998" height="390" rx="12" fill="url(#grid)" stroke="#34434e"/>
<text x="36" y="38" font-family="Consolas,monospace" font-size="14" font-weight="400" fill="#ffb347" letter-spacing="1.2">SELECTED WORK / NOXIUS STUDIUM</text>
<text x="36" y="85" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#f4f0e6" >Things I have been building.</text>
