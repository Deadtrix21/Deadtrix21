<text x="52" y="306" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#aab8be" >Discovery + HTTPS streams</text>
<path d="M293 289H337V289H355" fill="none" stroke="#3ad6c6" stroke-width="2" class="flow"/>
<rect x="36" y="336" width="257" height="62" rx="8" fill="#121d24" stroke="#34434e"/>
<text x="52" y="362" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="600" fill="#f4f0e6" >Local library</text>
<text x="52" y="384" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#aab8be" >Approved folders + SQLite</text>
